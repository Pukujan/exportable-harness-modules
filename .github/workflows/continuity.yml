name: continuity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: continuity validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PCM 0.4.0
        run: python -m pip install "git+https://github.com/Pukujan/project-continuity-modules.git@9328f363a56d46290904b786eb43cff87e23c2b4"
      - name: Validate this repository
        run: python -m continuity validate --root .
